name: parenthug
description: "ParentHug: the next right words when parenting gets hard."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Backend (Supabase Auth, Postgres, Storage, Edge Functions)
  supabase_flutter: ^2.8.0

  # Payments (RevenueCat)
  purchases_flutter: ^8.2.0

  # Social sign-in (native Google + Apple → Supabase signInWithIdToken)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # UI / assets
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ParentHug-appcion.png
